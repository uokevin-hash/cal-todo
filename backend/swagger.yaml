openapi: 3.0.3
info:
  title: cal-todo API
  version: 0.2.0
  description: '배드민턴 동호회 일별 참석 관리 웹앱 API. 근거: docs/2-PRD.md v0.12 9장(API 개요·핵심 응답 형식, 계약의 단일 출처 L-14), 6.1(인증), 8장 D-4, NFR-10; docs/5-project-principle.md v0.8 C-8(오류 형식·HTTP 상태↔code), N-8~N-11; docs/1-definition.md v0.14 4장·R-n. JSON 필드는 camelCase, 날짜는 "YYYY-MM-DD". 경로 id가 정수가 아니면 404 NOT_FOUND(없는 대상과 같게 취급). PATCH는 부분 갱신(보낸 필드만 변경, 빈 본문 {}은 200 변경 없음). 성공 상태 코드(201/200/204) 중 PRD 9장에 없는 것은 docs/8-plan.md 완료 조건을 따랐다.'
servers:
  - url: /api
tags:
  - name: auth
    description: 가입·로그인·토큰 재발급·로그아웃(PRD 6.1)
  - name: me
    description: 내 정보(UC-3)
  - name: calendar
    description: 월 캘린더(UC-4)
  - name: attendance
    description: 참석 등록·취소·현황 조회(UC-4, UC-5)
  - name: groups
    description: 날짜별 그룹 조회·생성(UC-4, UC-6)
  - name: admin
    description: 관리자(ADMIN) 전용(R-8)
paths:
  /auth/signup:
    post:
      tags:
        - auth
      summary: 회원가입
      operationId: signup
      description: "UC-1, FR-1, R-9(삭제된 회원 이메일 재사용 가능). 역할은 MEMBER. 성공 201, 본문 없음. 400 code: VALIDATION_ERROR(field: name|email|password|phone|birthDate). 409 code: EMAIL_TAKEN(활성 회원 이메일 중복)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: 가입 완료. 본문 없음
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
  /auth/login:
    post:
      tags:
        - auth
      summary: 로그인
      operationId: login
      description: "UC-2, FR-2, R-1, 6.1 흐름 1·9. 본문에 Access Token, 쿠키로 Refresh Token 발급. 400 code: VALIDATION_ERROR(field: email|password — 누락·형식 오류), INVALID_CREDENTIALS(형식은 맞는데 인증 실패: 없는 이메일·틀린 비밀번호·삭제된 회원 모두 동일, D-4). 429 code: TOO_MANY_ATTEMPTS(FR-18, P2)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: minsu@example.com
              password: password123
      responses:
        "200":
          description: 로그인 성공
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "500":
          $ref: "#/components/responses/Internal"
  /auth/refresh:
    post:
      tags:
        - auth
      summary: Access Token 재발급
      operationId: refreshToken
      description: "UC-2, 6.1 흐름 3~6(AD-5). 쿠키의 Refresh Token을 검증·교체(rotation)하고 새 Access Token과 새 Refresh Token 쿠키를 발급한다. 401 code: REFRESH_RACE(ROTATED 폐기 30초 이내, 클라이언트는 1회 재시도), UNAUTHENTICATED(쿠키 없음·무효·폐기·탈퇴·비밀번호 변경 전 발급)."
      security:
        - refreshCookie: []
      responses:
        "200":
          description: 재발급 성공
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
  /auth/logout:
    post:
      tags:
        - auth
      summary: 로그아웃
      operationId: logout
      description: UC-2, 6.1 흐름 7. Refresh Token 행을 폐기(LOGOUT)하고 쿠키를 지운다. 쿠키가 없거나 무효여도 204(멱등).
      security:
        - refreshCookie: []
      responses:
        "204":
          description: 로그아웃 완료, 쿠키 삭제
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearRefreshCookie"
        "500":
          $ref: "#/components/responses/Internal"
  /me:
    get:
      tags:
        - me
      summary: 내 정보 조회
      operationId: getMe
      description: UC-3, FR-8. 나이(age)는 Asia/Seoul 현재연도 - 출생연도(R-12). 비밀번호 해시는 내보내지 않는다(NFR-6).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 내 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      tags:
        - me
      summary: 내 정보 수정
      operationId: updateMe
      description: "UC-3, FR-8, R-8, R-10(role·isPermanent는 본문에서 읽지 않음, C-9), R-11, 6.1 흐름 8. 부분 갱신(보낸 필드만 변경, 빈 본문 {}은 200 변경 없음). 비밀번호 변경은 newPassword + currentPassword 필수. 비밀번호를 바꾸면 다른 기기의 Refresh Token은 폐기(FORCED)하고 현재 세션에는 새 토큰을 발급한다. 400 code: VALIDATION_ERROR, WRONG_PASSWORD(field: currentPassword). 409 code: EMAIL_TAKEN."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: 비밀번호를 바꾸지 않으면 Me, 바꾸면 AccessToken + 새 Refresh Token 쿠키(PRD 9장). 화면은 새 Access Token 저장 뒤 GET /me로 다시 읽는다
          headers:
            Set-Cookie:
              description: 비밀번호를 바꾼 경우에만. 새 refresh_token 쿠키(HttpOnly; Secure(운영); SameSite=Strict; Path=/api/auth)
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Me"
                  - $ref: "#/components/schemas/AccessToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
  /calendar:
    get:
      tags:
        - calendar
      summary: 월 캘린더 조회
      operationId: getCalendar
      description: "UC-4, FR-4. 날짜별 그룹 수, 내 참석 날짜. 그룹이 있거나 내가 참석한 날짜만 days에 담는다. 400 code: VALIDATION_ERROR(field: month — 형식 오류)."
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          required: false
          description: '"YYYY-MM". 없으면 이번 달(Asia/Seoul)'
          schema:
            type: string
            pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          example: 2026-10
      responses:
        "200":
          description: 날짜별 그룹 수와 내 참석 여부
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calendar"
              example:
                month: 2026-10
                days:
                  - date: 2026-10-03
                    groupCount: 2
                    attending: true
                  - date: 2026-10-05
                    groupCount: 1
                    attending: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
  /dates/{date}/groups:
    parameters:
      - name: date
        in: path
        required: true
        description: 날짜 "YYYY-MM-DD"
        schema:
          type: string
          format: date
    get:
      tags:
        - groups
      summary: 날짜별 그룹 조회
      operationId: listGroupsOfDate
      description: UC-4, FR-5, R-5, R-9·FR-15(탈퇴 회원 표시), NFR-2.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 그날 그룹·상태·참석자
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupOfDate"
              example:
                - id: 12
                  name: 토요복식
                  capacity: 4
                  count: 3
                  status: AVAILABLE
                  createdBy:
                    memberId: 3
                    name: 김민수
                  attendees:
                    - memberId: 3
                      name: 김민수
                    - memberId: 5
                      name: 이지은
                    - memberId: 9
                      name: 탈퇴 회원
                  mine: true
                - id: 13
                  name: 기본
                  capacity: 2
                  count: 2
                  status: FULL
                  createdBy:
                    memberId: 7
                    name: 박관리
                  attendees:
                    - memberId: 7
                      name: 박관리
                    - memberId: 8
                      name: 정민호
                  mine: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags:
        - groups
      summary: 그룹 생성
      operationId: createGroup
      description: "UC-6, FR-7, R-2, R-4, REQ-12, NFR-3~5(AD-6). 한 트랜잭션. attend=true인데 그날 이미 참석 중이면 그룹도 만들지 않고 409. attend는 선택, 기본값 true(SCR-05). 성공 201 {id}. 400 code: VALIDATION_ERROR(field: name — 이름 `기본` 불가(R-2), field: capacity). 409 code: DUPLICATE_GROUP_NAME, ALREADY_ATTENDING."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: 그룹 생성(attend=true면 참석까지). 만든 그룹 id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
  /dates/{date}/attendance:
    parameters:
      - name: date
        in: path
        required: true
        description: 날짜 "YYYY-MM-DD"
        schema:
          type: string
          format: date
    post:
      tags:
        - attendance
      summary: 그룹 없이 참석
      operationId: attendDefaultGroup
      description: "UC-4, FR-6, R-2, R-3, R-4, NFR-5(AD-6). `기본` 그룹이 있으면 참석, 없으면 capacity로 생성 후 참석(ON CONFLICT DO NOTHING). `기본` 그룹 생성은 이 API로만 한다. 성공 201 {groupId}(들어간 `기본` 그룹 id). 400 code: VALIDATION_ERROR(field: capacity — `기본` 그룹이 없는데 capacity 없음). 409 code: CAPACITY_FULL, ALREADY_ATTENDING."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendDefaultRequest"
      responses:
        "201":
          description: 참석 등록. 들어간 `기본` 그룹 id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
  /groups/{id}/attendance:
    parameters:
      - name: id
        in: path
        required: true
        description: 그룹 ID. 정수가 아니면 404 NOT_FOUND
        schema:
          type: integer
    post:
      tags:
        - attendance
      summary: 그룹 참석
      operationId: attendGroup
      description: "UC-4, FR-5, R-3, R-4, R-6(날짜 제한 없음), NFR-3·4(AD-6). 성공 201 {groupId}. 404: 그룹 없음. 409 code: CAPACITY_FULL, ALREADY_ATTENDING."
      security:
        - bearerAuth: []
      responses:
        "201":
          description: 참석 등록. 들어간 그룹 id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags:
        - attendance
      summary: 내 참석 취소
      operationId: cancelAttendance
      description: "UC-4, FR-5, R-6(지난 날짜도 취소 가능, 참석 기록 삭제). 멱등: 참석하지 않은 그룹이어도 204. 404: 그룹 자체가 없음."
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 취소 완료(참석하지 않은 그룹이어도 204)
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /attendance:
    get:
      tags:
        - attendance
      summary: 참석 현황 조회
      operationId: listAttendance
      description: "UC-5, FR-14, FR-15, R-5, R-7, R-9(비관리자의 이름 검색에 탈퇴 회원 실명이 걸리지 않음), REQ-7. 그룹 단위 행 배열. from·to가 없으면 이번 달(Asia/Seoul) 1일~말일, 기간 최대 93일, 페이지네이션 없음. 400 code: VALIDATION_ERROR(field: to — 93일 초과, 그 밖의 형식 오류)."
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          description: 기간 시작 "YYYY-MM-DD". 없으면 이번 달 1일
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: 기간 끝 "YYYY-MM-DD". 없으면 이번 달 말일. from~to 최대 93일
          schema:
            type: string
            format: date
        - name: group
          in: query
          required: false
          description: 그룹명(부분 일치, 대소문자 무시, name과 같은 방식)
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: 참석자 이름(부분 일치)
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: 그룹 상태(R-5)
          schema:
            type: string
            enum:
              - AVAILABLE
              - FULL
        - name: capacity
          in: query
          required: false
          description: 정원
          schema:
            type: integer
            enum:
              - 2
              - 4
      responses:
        "200":
          description: 그룹 단위 행 배열
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
  /admin/members:
    get:
      tags:
        - admin
      summary: 회원 목록
      operationId: listMembers
      description: "관리자(ADMIN)만. UC-7, FR-9, FR-16(삭제된 회원 보기), FR-19(q, P1). 기본은 활성 회원만. 관리자 응답이므로 탈퇴 회원도 실명(isDeleted: true)."
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: 이름·이메일 부분 일치 검색(FR-19, P1)
          schema:
            type: string
        - name: includeDeleted
          in: query
          required: false
          description: true면 삭제된 회원도 포함
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 회원 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminMember"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
  /admin/members/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: 회원 ID. 정수가 아니면 404 NOT_FOUND
        schema:
          type: integer
    patch:
      tags:
        - admin
      summary: 회원 정보·새 비밀번호·역할 수정
      operationId: updateMember
      description: "관리자(ADMIN)만. UC-7, UC-8, FR-9, FR-11, R-8, R-10, R-11, REQ-16, 6.1 흐름 8. 새 비밀번호를 지정하면 그 회원의 Refresh Token을 모두 폐기(FORCED). 부분 갱신(보낸 필드만 변경, 빈 본문 {}은 200 변경 없음). 성공 200, GET /admin/members의 한 행과 같은 객체. 400 code: VALIDATION_ERROR. 403 code: FORBIDDEN(비관리자, 대상이 자기 자신인데 새 비밀번호 있음). 404: 회원 없음. 409 code: EMAIL_TAKEN, PERMANENT_ADMIN_LOCKED(영구 관리자의 이메일·비밀번호·역할 변경), MEMBER_DELETED(삭제된 회원 수정)."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateMemberRequest"
      responses:
        "200":
          description: 수정 완료. GET /admin/members의 한 행과 같은 객체
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags:
        - admin
      summary: 회원 비활성화
      operationId: deleteMember
      description: "관리자(ADMIN)만. UC-7, FR-10, R-9, R-11, R-12(AD-7). deleted_at 기록, 오늘(Asia/Seoul) 포함 이후 참석 삭제, Refresh Token 모두 폐기(FORCED). 403 code: FORBIDDEN(비관리자, 자기 자신). 404: 회원 없음. 409 code: PERMANENT_ADMIN_LOCKED, MEMBER_DELETED(이미 삭제됨)."
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 비활성화 완료
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
  /admin/groups:
    get:
      tags:
        - admin
      summary: 그룹 목록
      operationId: listAdminGroups
      description: "관리자(ADMIN)만. UC-9, FR-17(P1). from·to는 GET /attendance와 같은 규칙: 없으면 이번 달(Asia/Seoul) 1일~말일, 기간 최대 93일. 만든 사람이 탈퇴 회원이면 실명 + isDeleted: true. 400 code: VALIDATION_ERROR(field: to — 93일 초과, 그 밖의 형식 오류)."
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          description: 기간 시작 "YYYY-MM-DD". 없으면 이번 달 1일
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: 기간 끝 "YYYY-MM-DD". 없으면 이번 달 말일. from~to 최대 93일
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 그룹 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
  /admin/groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: 그룹 ID. 정수가 아니면 404 NOT_FOUND
        schema:
          type: integer
    patch:
      tags:
        - admin
      summary: 그룹명·정원 수정
      operationId: updateGroup
      description: "관리자(ADMIN)만. UC-9, FR-12, R-2, R-3, NFR-3(그룹 행 FOR UPDATE 후 인원 비교). 날짜는 수정하지 않는다. 부분 갱신(보낸 필드만 변경, 빈 본문 {}은 200 변경 없음). 성공 200, GET /admin/groups의 한 행과 같은 객체. 400 code: VALIDATION_ERROR(field: name — 새 이름 `기본` 또는 `기본` 그룹 이름 변경, field: capacity). 404: 그룹 없음. 409 code: DUPLICATE_GROUP_NAME, CAPACITY_BELOW_COUNT."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateGroupRequest"
      responses:
        "200":
          description: 수정 완료. GET /admin/groups의 한 행과 같은 객체
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags:
        - admin
      summary: 그룹 삭제와 참석 초기화
      operationId: deleteGroup
      description: "관리자(ADMIN)만. UC-11, FR-13, R-13, REQ-17. 그룹과 그 참석 기록을 모두 삭제(ON DELETE CASCADE). `기본` 그룹도 삭제 가능. 404: 그룹 없음."
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 삭제 완료
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /admin/groups/{id}/attendance/{memberId}:
    parameters:
      - name: id
        in: path
        required: true
        description: 그룹 ID. 정수가 아니면 404 NOT_FOUND
        schema:
          type: integer
      - name: memberId
        in: path
        required: true
        description: 회원 ID. 정수가 아니면 404 NOT_FOUND
        schema:
          type: integer
    delete:
      tags:
        - admin
      summary: 참석자 빼기
      operationId: removeAttendee
      description: "관리자(ADMIN)만. UC-9, FR-12, R-7, R-8. 확인 없이 즉시 참석 기록 삭제. 404: 대상 없음."
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 참석자 제거 완료
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access Token(HS256, 15분, 페이로드 sub·type="access"). 만료 401 TOKEN_EXPIRED, 무효·탈퇴·비밀번호 변경 전 발급 401 UNAUTHENTICATED(6.1 흐름 2·3)
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Refresh Token(HS256, 14일). HttpOnly; Secure(운영); SameSite=Strict; Path=/api/auth(6.1)
  headers:
    SetRefreshCookie:
      description: refresh_token=<JWT>; HttpOnly; Secure(운영); SameSite=Strict; Path=/api/auth
      schema:
        type: string
    ClearRefreshCookie:
      description: refresh_token 쿠키 삭제(Path=/api/auth)
      schema:
        type: string
  schemas:
    Error:
      type: object
      required:
        - error
      description: 오류 응답 형식(C-8). message는 로그·디버깅용이며 화면 문구는 code로 찾는다(N-15)
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - INVALID_CREDENTIALS
                - WRONG_PASSWORD
                - TOKEN_EXPIRED
                - REFRESH_RACE
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CAPACITY_FULL
                - ALREADY_ATTENDING
                - DUPLICATE_GROUP_NAME
                - EMAIL_TAKEN
                - CAPACITY_BELOW_COUNT
                - PERMANENT_ADMIN_LOCKED
                - MEMBER_DELETED
                - TOO_MANY_ATTEMPTS
                - INTERNAL
            message:
              type: string
            field:
              type: string
              description: "오류가 난 입력 필드(예: email, currentPassword, capacity, to)"
    AccessToken:
      type: object
      required:
        - accessToken
      properties:
        accessToken:
          type: string
          description: JWT Access Token. 클라이언트는 메모리에만 보관
    MemberRef:
      type: object
      required:
        - memberId
        - name
      description: '회원 표시 객체(참석자, 만든 사람). 비관리자에게 탈퇴 회원은 name "탈퇴 회원"(memberId 유지), 관리자에게는 실명 + isDeleted: true(R-9, FR-15)'
      properties:
        memberId:
          type: integer
        name:
          type: string
        isDeleted:
          type: boolean
          enum:
            - true
          description: 관리자 응답의 탈퇴 회원에만 붙는다
    Me:
      type: object
      required:
        - id
        - name
        - email
        - phone
        - birthDate
        - age
        - role
        - isPermanent
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        birthDate:
          type: string
          format: date
        age:
          type: integer
          description: 현재연도 - 출생연도(Asia/Seoul, R-12)
        role:
          type: string
          enum:
            - MEMBER
            - ADMIN
        isPermanent:
          type: boolean
    GroupStatus:
      type: string
      enum:
        - AVAILABLE
        - FULL
      description: AVAILABLE(참석가능, count < capacity) 또는 FULL(참석완료, count = capacity)(R-5)
    GroupOfDate:
      type: object
      required:
        - id
        - name
        - capacity
        - count
        - status
        - createdBy
        - attendees
        - mine
      properties:
        id:
          type: integer
        name:
          type: string
        capacity:
          type: integer
          enum:
            - 2
            - 4
        count:
          type: integer
          description: 현재 참석 인원
        status:
          $ref: "#/components/schemas/GroupStatus"
        createdBy:
          $ref: "#/components/schemas/MemberRef"
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/MemberRef"
        mine:
          type: boolean
          description: 요청자가 이 그룹에 참석했는지
    AttendanceRow:
      type: object
      required:
        - date
        - groupId
        - groupName
        - capacity
        - count
        - status
        - attendees
      properties:
        date:
          type: string
          format: date
        groupId:
          type: integer
        groupName:
          type: string
        capacity:
          type: integer
          enum:
            - 2
            - 4
        count:
          type: integer
        status:
          $ref: "#/components/schemas/GroupStatus"
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/MemberRef"
    Calendar:
      type: object
      required:
        - month
        - days
      properties:
        month:
          type: string
          description: '"YYYY-MM"'
          example: 2026-10
        days:
          type: array
          description: 그룹이 있거나 내가 참석한 날짜만
          items:
            type: object
            required:
              - date
              - groupCount
              - attending
            properties:
              date:
                type: string
                format: date
              groupCount:
                type: integer
                description: 그날 그룹 수(●n)
              attending:
                type: boolean
                description: 그날 내가 참석 중인지(✔)
    CreatedGroup:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          description: 만든 그룹 id
    AttendResult:
      type: object
      required:
        - groupId
      properties:
        groupId:
          type: integer
          description: 들어간 그룹 id(그룹 없이 참석이면 `기본` 그룹)
    AdminMember:
      description: 관리자용 회원 행. Me 필드 + isDeleted. 관리자 응답이므로 탈퇴 회원도 실명
      allOf:
        - $ref: "#/components/schemas/Me"
        - type: object
          required:
            - isDeleted
          properties:
            isDeleted:
              type: boolean
    AdminGroup:
      type: object
      required:
        - id
        - date
        - name
        - capacity
        - count
        - status
        - createdBy
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
        name:
          type: string
        capacity:
          type: integer
          enum:
            - 2
            - 4
        count:
          type: integer
          description: 현재 참석 인원
        status:
          $ref: "#/components/schemas/GroupStatus"
        createdBy:
          $ref: "#/components/schemas/MemberRef"
    SignupRequest:
      type: object
      required:
        - name
        - email
        - password
        - phone
        - birthDate
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          description: 로그인 ID. 활성 회원 사이에서 중복 불가(R-9)
        password:
          type: string
          minLength: 8
          description: 8자 이상, 최대 72바이트(UTF-8, bcrypt 한계). 72바이트 초과는 400 VALIDATION_ERROR(NFR-10)
        phone:
          type: string
          pattern: ^01[0-9]-?[0-9]{3,4}-?[0-9]{4}$
          description: 휴대전화 `01X-XXX(X)-XXXX`, 하이픈 생략 가능, 숫자 10~11자리(정의서 4.1)
          example: 010-1234-5678
        birthDate:
          type: string
          format: date
          description: '"YYYY-MM-DD". 미래 날짜 불가(서버가 Asia/Seoul 오늘로 판단, C-9)'
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
    UpdateMeRequest:
      type: object
      description: 비밀번호를 바꿀 때만 currentPassword와 새 비밀번호를 보낸다. role·isPermanent는 보내도 무시한다(R-10, C-9). 부분 갱신. 보낸 필드만 바꾸고 빈 본문 {}은 변경 없음
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: ^01[0-9]-?[0-9]{3,4}-?[0-9]{4}$
          description: 휴대전화 `01X-XXX(X)-XXXX`, 하이픈 생략 가능, 숫자 10~11자리(정의서 4.1)
          example: 010-1234-5678
        birthDate:
          type: string
          format: date
          description: '"YYYY-MM-DD". 미래 날짜 불가(서버가 Asia/Seoul 오늘로 판단, C-9)'
        currentPassword:
          type: string
          description: 비밀번호 변경 시 필수. 틀리면 400 WRONG_PASSWORD
        newPassword:
          type: string
          minLength: 8
          description: 8자 이상, 최대 72바이트(UTF-8, bcrypt 한계). 72바이트 초과는 400 VALIDATION_ERROR(NFR-10)
    CreateGroupRequest:
      type: object
      required:
        - name
        - capacity
      properties:
        name:
          type: string
          minLength: 1
          description: 같은 날짜 안에서 중복 불가. `기본`은 쓸 수 없다(R-2)
        capacity:
          type: integer
          enum:
            - 2
            - 4
          description: 정원. 2(단식) 또는 4(복식/혼복)
        attend:
          type: boolean
          default: true
          description: 선택. true면 만든 사람을 첫 참석자로 등록(R-2, SCR-05 "만든 뒤 바로 참석" 기본 선택)
    AttendDefaultRequest:
      type: object
      properties:
        capacity:
          type: integer
          enum:
            - 2
            - 4
          description: "`기본` 그룹이 없을 때 필수(생성할 그룹의 정원). 있으면 무시"
    AdminUpdateMemberRequest:
      type: object
      description: 영구 관리자는 name·phone·birthDate만 수정 가능(R-11). 새 비밀번호(newPassword)를 비우면 바꾸지 않는다. 부분 갱신. 보낸 필드만 바꾸고 빈 본문 {}은 변경 없음
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: ^01[0-9]-?[0-9]{3,4}-?[0-9]{4}$
          description: 휴대전화 `01X-XXX(X)-XXXX`, 하이픈 생략 가능, 숫자 10~11자리(정의서 4.1)
          example: 010-1234-5678
        birthDate:
          type: string
          format: date
          description: '"YYYY-MM-DD". 미래 날짜 불가(서버가 Asia/Seoul 오늘로 판단, C-9)'
        newPassword:
          type: string
          minLength: 8
          description: 8자 이상, 최대 72바이트(UTF-8, bcrypt 한계). 72바이트 초과는 400 VALIDATION_ERROR(NFR-10)
        role:
          type: string
          enum:
            - MEMBER
            - ADMIN
    AdminUpdateGroupRequest:
      type: object
      description: 부분 갱신. 보낸 필드만 바꾸고 빈 본문 {}은 변경 없음
      properties:
        name:
          type: string
          minLength: 1
          description: "`기본`으로 바꾸거나 `기본` 그룹 이름을 바꿀 수 없다(R-2)"
        capacity:
          type: integer
          enum:
            - 2
            - 4
          description: 현재 인원보다 작게 할 수 없다(R-3)
  responses:
    BadRequest:
      description: "400 잘못된 요청. code: VALIDATION_ERROR(+field, 입력 누락·형식 오류), INVALID_CREDENTIALS(로그인 인증 실패), WRONG_PASSWORD(PATCH /me 현재 비밀번호 틀림). operation 설명의 code 목록 참고"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: "401 미인증. code: TOKEN_EXPIRED(재발급 시도), REFRESH_RACE(/auth/refresh 재시도), UNAUTHENTICATED(SCR-01로 이동)(D-4)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "403 권한 없음. code: FORBIDDEN"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "404 대상 없음. code: NOT_FOUND"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "409 업무 규칙 거부. code: CAPACITY_FULL, ALREADY_ATTENDING, DUPLICATE_GROUP_NAME, EMAIL_TAKEN, CAPACITY_BELOW_COUNT, PERMANENT_ADMIN_LOCKED, MEMBER_DELETED. operation 설명의 code 목록 참고"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: CAPACITY_FULL
              message: 정원이 가득 찼습니다
    TooManyAttempts:
      description: "429 로그인 시도 제한 초과(같은 이메일 15분 안에 5회 실패 → 15분 거부). code: TOO_MANY_ATTEMPTS(FR-18, P2)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: "500 예상하지 못한 오류. code: INTERNAL(메시지에 내부 정보 없음)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
